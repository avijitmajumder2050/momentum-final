version: "3.9"

services:
  api:
    build: .
    image: momentum-platform:latest
    container_name: momentum-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - runtime.env
    environment:
      - USE_SSM=true
      - AWS_REGION=ap-south-1

    healthcheck:
      test: ["CMD","curl","-f","http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  watchdog:
  image: docker:24-cli
  container_name: momentum-watchdog
  restart: unless-stopped

  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

  entrypoint: ["/bin/sh", "-c"]

  command: >
    while true; do
      STATUS=$(docker inspect -f '{{.State.Health.Status}}' momentum-api 2>/dev/null || echo "missing");

      echo "$(date) - Health: $STATUS";

      if [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "missing" ]; then
        echo "Restarting momentum-api...";
        docker restart momentum-api;
      fi;

      sleep 20;
    done