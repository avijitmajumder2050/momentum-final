version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: momentum-watchlist:latest
    container_name: momentum-api
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      USE_SSM: ${USE_SSM:-true}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      MAX_LOSS: ${MAX_LOSS:-1000}
      DEPLOY_PCT: ${DEPLOY_PCT:-0.30}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-15}
      apiKey: ${apiKey:-}
      totpKey: ${totpKey:-}
      userid: ${userid:-}
      pin: ${pin:-}
      S3_BUCKET: ${S3_BUCKET:-your-momentum-bucket}
      TRADING_CAPITAL: ${TRADING_CAPITAL:-100000}

    # ❌ REMOVE in EC2 (important)
    # volumes:
    #   - ../backend:/app

    # Cap memory so this container can't freeze the shared t3.micro host;
    # if exceeded, only this container is OOM-killed and restarted.
    mem_limit: 300m

    # Healthcheck without curl (python:3.11-slim has no curl)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"